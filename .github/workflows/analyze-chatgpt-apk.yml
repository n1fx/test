name: Analyze ChatGPT APK release
on:
  push:
    branches: [apk-analysis-20261126]
    paths:
      - ".github/workflows/analyze-chatgpt-apk.yml"
      - "tools/analyze_chatgpt_apk.py"
      - "analysis/RMCP_followup_20261126.md"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-analysis-20261126
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk-analysis-20261126
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify release asset
        run: |
          mkdir -p work
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/n1fx/test/releases/download/v1/ChatGPT_APK.zip" \
            --output work/ChatGPT_APK.zip
          echo "513131d742a8e724a1efbb030497390cdfe60234af468bfd2b3de08c6f10f6a5  work/ChatGPT_APK.zip" | sha256sum --check -
          test "$(stat -c%s work/ChatGPT_APK.zip)" = "65134217"
      - name: Install analysis dependency
        run: python -m pip install --no-cache-dir androguard==4.1.3
      - name: Analyze APK
        run: python tools/analyze_chatgpt_apk.py
      - name: Commit analysis output to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/
          if git diff --cached --quiet; then
            echo "No analysis output changes to commit."
          else
            git commit -m "Add ChatGPT APK static analysis results"
            for attempt in 1 2 3; do
              git pull --rebase origin apk-analysis-20261126
              if git push origin apk-analysis-20261126; then
                exit 0
              fi
              sleep 2
            done
            echo "Push failed after retries" >&2
            exit 1
          fi
